server:
  port: 8080

spring:
  application:
    name: xiaojuzi-blog
  
  # MySQL
  datasource:
    # allowPublicKeyRetrieval=true 是 MySQL 8 必需的：
    # MySQL 8 默认认证插件是 caching_sha2_password，在 useSSL=false（非加密连接）下，
    # 客户端必须向服务端索取 RSA 公钥来加密密码，JDBC 默认禁止该行为，
    # 会直接抛 "Public Key Retrieval is not allowed" 导致连不上库。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xiaojuzi_blog}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  # File Upload
  # 与 UploadController 里的 5MB 校验保持一致：这里先兜住超大请求，
  # 控制器再给出「图片不能超过 5MB」这种人话提示
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-must-be-at-least-256-bits-long}
  expiration: 86400000 # 24 hours

# File Storage
# 上传的图片落在这里，由 WebMvcConfig 映射成 /uploads/** 对外提供
file:
  upload-path: ${FILE_UPLOAD_PATH:/app/uploads/}

# Logging
logging:
  level:
    com.xiaojuzi.blog: debug
