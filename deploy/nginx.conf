# ============================================
# 小橘子的日常 - Nginx 配置
# ============================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后台上传图片最大 5MB（见 UploadController），nginx 默认只放行 1MB，
    # 不放开的话上传会直接被 nginx 拦成 413，根本到不了后端
    client_max_body_size 8m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件
    # 必须用 ^~ ：否则 /uploads/xxx.jpg 会先命中上面那条图片扩展名的正则 location，
    # 然后去 /usr/share/nginx/html 里找文件，结果 404（图片实际存在后端容器里）
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Vue Router History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}
