# ============================================
# 小橘子的日常 - Docker Compose 部署配置
# ============================================
# 使用方法：
# 1. 复制 .env.example 为 .env 并修改配置
# 2. docker-compose up -d
# 3. 访问 http://your-domain.com

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: xiaojuzi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-xiaojuzi_blog}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xiaojuzi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: xiaojuzi-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-xiaojuzi_blog}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-must-be-at-least-256-bits-long}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  # Vue3 前端 (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaojuzi-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  mysql_data:
  redis_data:
  uploads:
